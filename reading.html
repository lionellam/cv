<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading List — Lionel Lam</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/reading.css" />
  <script src="config.js"></script>
  <script>
    // As on the article pages: the configured theme, in dark if the visitor chose dark on the CV
    (function () {
      const base = (typeof SITE_CONFIG !== 'undefined' ? SITE_CONFIG.theme : null) || 'gold';
      const theme = localStorage.getItem('theme-dark') === 'true' ? base + '-dark' : base;
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    /* The full reading list, linked from the CV's Reading list section. Entries come from readingList in content.js */
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 48px 24px 64px; min-height: 100vh; display: flex; flex-direction: column; }
    .back { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--accent); text-decoration: none; margin-bottom: 40px; }
    .back:hover { text-decoration: underline; }
    .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--text-faint); margin: 0 0 10px; }
    h1 { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; color: var(--heading); margin: 0 0 12px; }
    .intro { font-size: 16px; color: var(--text-mid); line-height: 1.6; max-width: 62ch; margin: 0 0 26px; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 34px; }
    .filters[hidden] { display: none; }
    .filters button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: none; color: var(--text-muted); cursor: pointer; }
    .filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .group { margin-bottom: 40px; }
    .group-h { display: flex; align-items: center; gap: 14px; font-size: 20px; font-weight: 600; color: var(--heading); margin: 0 0 20px; }
    .group-h::after { content: ''; flex: 1; height: 1px; background: var(--border-light); }
    .group-h small { font-size: 13px; font-weight: 500; color: var(--text-faint); order: 2; }
    /* A grid of covers, five in a row (two on phones), each with its title and author beneath */
    .shelf { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px 18px; }
    .title { font-size: 13.5px; font-weight: 600; color: var(--heading); line-height: 1.3; margin-top: 10px; }
    .title a { color: inherit; text-decoration: none; }
    .title a:hover { color: var(--accent); }
    .by { font-size: 12.5px; color: var(--text-muted); }
    .when { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
    .empty { color: var(--text-muted); }
    .foot { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--border-light); font-size: 12px; color: var(--text-faint); }
    @media (max-width: 720px) {
      .wrap { padding: 32px 20px 48px; }
      h1 { font-size: 28px; }
      .shelf { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Back to CV</a>
    <p class="eyebrow"><span id="who"></span> · Ongoing learning</p>
    <h1>Reading list</h1>
    <p class="intro">Books and journals I'm reading, and have read, as part of my ongoing learning in project management, systems thinking and organisational change.</p>
    <div class="filters" role="group" aria-label="Show" id="filters" hidden>
      <button type="button" data-f="all" aria-pressed="true">All</button><button type="button" data-f="Book" aria-pressed="false">Books</button><button type="button" data-f="Journal" aria-pressed="false">Journals</button>
    </div>
    <div id="list"></div>
    <div class="foot" id="foot"></div>
  </div>

  <script src="content.js"></script>
  <script src="js/reading.js"></script>
  <script>
    const name = RESUME_DATA.profile.name;
    document.getElementById('who').textContent = name;
    document.getElementById('foot').textContent = `© ${new Date().getFullYear()} ${name}`;

    // One cover per item, with its title (linked if a link is given), author and, once read, the month it was finished
    const item = (r) => `
      <div>${READING.cover(r)}
        <div class="title">${r.link ? `<a href="${r.link}" target="_blank" rel="noopener noreferrer">${r.title}</a>` : r.title}</div>
        <div class="by">${r.author ?? ''}</div>
        ${r.status !== 'reading' && r.finished ? `<div class="when">Finished ${READING.month(r.finished)}</div>` : ''}
      </div>`;

    let filter = 'all';
    function draw() {
      const keep = (r) => filter === 'all' || (r.type ?? 'Book') === filter;
      const groups = [['Reading now', READING.now().filter(keep)]];
      // Everything finished, newest first, in one group
      groups.push(['Read', READING.finished().filter(keep)]);
      const html = groups.filter(([, l]) => l.length).map(([h, l]) =>
        `<section class="group"><h2 class="group-h">${h}<small>${l.length}</small></h2><div class="shelf">${l.map(item).join('')}</div></section>`).join('');
      document.getElementById('list').innerHTML = html || '<p class="empty">Nothing here yet.</p>';
    }
    // The filters are only offered when the list has both books and journals
    const types = new Set(READING.list().map((r) => r.type ?? 'Book'));
    document.getElementById('filters').hidden = types.size < 2;
    document.querySelectorAll('[data-f]').forEach((b) => b.addEventListener('click', () => {
      filter = b.dataset.f;
      document.querySelectorAll('[data-f]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      draw();
    }));
    draw();
  </script>
</body>
</html>
